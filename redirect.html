<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
<p>Signing in…</p>
<script src="lib/msal-redirect-bridge.min.js"></script>
<script>
  // If Android finished the sign-in in a separate tab, restore the sign-in state saved by the app before it left
  (function () {
    try {
      if (sessionStorage.getItem("msal.interaction.status")) return;
      var s = JSON.parse(localStorage.getItem("rc.signin") || "null");
      if (!s || Date.now() - s.t > 15 * 60 * 1000) return;
      Object.keys(s.keep).forEach(function (k) { sessionStorage.setItem(k, s.keep[k]); });
      sessionStorage.setItem("rc.restored", "1");
    } catch (e) {}
  })();
  // Never fall back to the site root (404): if no sign-in state could be found, go back to the app instead
  try {
    if (!sessionStorage.getItem("msal.interaction.status") && /[#&?]state=/.test(location.href)) {
      var st = JSON.parse(atob(decodeURIComponent((location.hash + location.search).match(/state=([^&]+)/)[1]).split("|")[0].replace(/-/g, "+").replace(/_/g, "/")));
      if (st && st.meta && st.meta.interactionType === "redirect") { location.replace("./?signin=lost"); throw 0; }
    }
  } catch (e) { if (e === 0) throw e; }
  msalRedirectBridge.broadcastResponseToMainFrame().catch(function (e) {
    document.body.innerHTML = '<p>Sign-in error: ' + (e && e.message ? e.message : e) + '</p><p><a style="color:#6cf" href="./">Back to app</a></p>';
  });
</script>
</body>
</html>
