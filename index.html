<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Receipt Capture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#111418; --card:#1c2128; --line:#2d333b; --text:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --err:#f85149; --acc:#2f81f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:env(safe-area-inset-top) 16px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 0 10px; }
  h1 { font-size:20px; margin:0; }
  #account { font-size:13px; color:var(--dim); text-align:right; }
  #account button { font-size:13px; padding:6px 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  input[type=text] { width:100%; font-size:17px; padding:12px; border-radius:8px; border:1px solid var(--line); background:#0d1117; color:var(--text); }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:#30363d; color:var(--text); }
  button.primary { background:var(--acc); color:#fff; }
  #shoot { width:100%; font-size:20px; font-weight:600; padding:22px; margin-top:12px; }
  #shoot:disabled { opacity:.5; }
  #gps { font-size:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--dim); vertical-align:middle; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
  #preview { width:100%; border-radius:8px; display:none; margin-top:10px; }
  #msg { font-size:14px; min-height:1.4em; margin-top:8px; }
  .msg-err { color:var(--err); } .msg-ok { color:var(--ok); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  li:first-child { border-top:0; }
  li .name { word-break:break-word; }
  li .sub { color:var(--dim); font-size:12px; }
  li .st { white-space:nowrap; font-size:12px; }
  .st.done { color:var(--ok); } .st.pending { color:var(--warn); } .st.failed { color:var(--err); }
  li button { padding:6px 10px; font-size:12px; }
  #queueHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #queueHead h2 { font-size:15px; margin:0; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <h1>Receipt Capture</h1>
  <div id="account">…</div>
</header>

<div class="card">
  <div id="gps"><span class="dot"></span>Getting location…</div>
</div>

<div class="card">
  <label for="note">Supplier / note (optional, goes in the file name)</label>
  <input id="note" type="text" placeholder="e.g. Bunnings" autocomplete="off" autocapitalize="words">
  <button id="shoot" class="primary">Take receipt photo</button>
  <input id="file" type="file" accept="image/*" capture="environment">
  <div id="msg"></div>
  <img id="preview" alt="Last receipt">
</div>

<div class="card">
  <div id="queueHead"><h2>Recent</h2><button id="retry">Retry uploads</button></div>
  <ul id="queue"><li><span class="sub">Nothing yet</span></li></ul>
</div>

<script src="config.js?v=3"></script>
<script src="lib/msal-browser.min.js"></script>
<script src="lib/piexif.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
